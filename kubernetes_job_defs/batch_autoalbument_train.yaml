apiVersion: batch/v1
kind: Job
metadata:
  name: sihang-autoalbument-train-50k-job
  namespace: gp-engine-malof
  labels:
    job-name: sihang-autoalbument-train-50k-job
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        job-name: sihang-autoalbument-train-50k-job
    spec:
      restartPolicy: Never
      containers:
        - name: autoalbument-container
          image: gitlab-registry.nrp-nautilus.io/nrp/scientific-images/python:cuda-v1.5.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - '-c'
          args:
            - |
              # Activate base environment
              source activate base

              # Create new conda environment
              conda create -n synrs3d python=3.11 -y

              # Activate the new environment
              source activate synrs3d

              # Install PyTorch with CUDA support
              pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118

              # Install GDAL
              conda install gdal -y

              # Install Python packages
              python -m pip install albumentations==2.0.5 tqdm ever-beta==0.2.3 huggingface_hub rasterio
              python -m pip install scikit-learn
              
              # # Install AutoAlbument
              # pip install autoalbument==1.4.18

              echo "Dependencies installed"

              # Replace the albumentations transform file
              rm /opt/conda/envs/synrs3d/lib/python3.11/site-packages/albumentations/pytorch/transforms.py
              cp /mnt/synrs3d/swap_env_files/transforms.py /opt/conda/envs/synrs3d/lib/python3.11/site-packages/albumentations/pytorch/

              # Navigate to SynRS3D directory
              cd /mnt/synrs3d/SynRS3D

              # Make sure we have the latest code
              # git fetch --all
              git checkout gaussian-baselines
              git pull
              
              # cat /mnt/synrs3d/SynRS3D/autoalbument/outputs/2025-09-09/01-31-02/policy/latest.json
              # cat /mnt/synrs3d/SynRS3D/autoalbument/outputs/2025-10-05/17-13-57/policy
              cat /mnt/synrs3d/SynRS3D/autoalbument/outputs/2025-10-11/09-00-57/policy/epoch_50.json

              
              # Print the version of autoalbument
              python -c "import autoalbument; print(autoalbument.__version__)"


              # Make the script executable and run it
              # chmod +x /mnt/synrs3d/SynRS3D/so_autoalbument_50k.sh
              bash /mnt/synrs3d/SynRS3D/so_autoalbument_50k.sh \
                /mnt/synrs3d/SynRS3D/autoalbument/outputs/2025-10-19/05-22-04/policy/latest.json
              
              # Optional: Run evaluation after training completes
              # bash /mnt/synrs3d/SynRS3D/eval_he.sh >> /mnt/synrs3d/SynRS3D/eval_autoalbument_he.log
              # bash /mnt/synrs3d/SynRS3D/eval_ss.sh >> /mnt/synrs3d/SynRS3D/eval_autoalbument_ss.log
              
          resources:
            limits:
              cpu: '16'
              memory: 32Gi  
              nvidia.com/gpu: '1'
            requests:
              cpu: '8'
              memory: 16Gi
              nvidia.com/gpu: '1'
          volumeMounts:
            - name: pvc-storage
              mountPath: /mnt/synrs3d
            - name: chuqiao-result-pvc
              mountPath: /mnt/styled
            - name: shm
              mountPath: /dev/shm
          securityContext:
              runAsUser: 0
      volumes:
        - name: pvc-storage
          persistentVolumeClaim:
            claimName: synrs3d-test
        - name: chuqiao-result-pvc
          persistentVolumeClaim:
            claimName: chuqiao-result-pvc
        - name: shm
          emptyDir:
            medium: Memory
