apiVersion: v1
kind: Service
metadata:
  name: sihang-tensorboard-svc
  namespace: gp-engine-malof
  labels:
    app: sihang-tensorboard
spec:
  type: ClusterIP
  ports:
  - port: 6006
    targetPort: 6006
  selector:
    app: sihang-tensorboard
---
apiVersion: v1
kind: Pod
metadata:
  name: sihang-tensorboard
  namespace: gp-engine-malof
  labels:
    app: sihang-tensorboard
spec:
  containers:
  - name: tensorboard
    image: tensorflow/tensorflow:latest
    command:
      - tensorboard
      - --logdir=/mnt/synrs3d/SynRS3D/snapshot_so_autoalbument_50k
      - --bind_all
      - --port=6006
    ports:
    - containerPort: 6006
    resources:
      requests:
        cpu: '1'
        memory: 2Gi
      limits:
        cpu: '2'
        memory: 4Gi
    volumeMounts:
      - name: pvc-storage
        mountPath: /mnt/synrs3d
  - name: debug-container
    image: gitlab-registry.nrp-nautilus.io/nrp/scientific-images/python:cuda-v1.5.0
    command: ["sleep", "infinity"]
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: '1'
        memory: 8Gi
      requests:
        cpu: '1'
        memory: 8Gi
    volumeMounts:
      - name: pvc-storage
        mountPath: /mnt/synrs3d
      - name: chuqiao-result
        mountPath: /mnt/styled
    securityContext:
      runAsUser: 0
  volumes:
    - name: pvc-storage
      persistentVolumeClaim:
        claimName: synrs3d-test
    - name: chuqiao-result
      persistentVolumeClaim:
        claimName: chuqiao-result-pvc