apiVersion: batch/v1
kind: Job
metadata:
  name: sihang-autoalbument-brightness-low-task
  namespace: gp-engine-malof
  labels:
    job-name: sihang-autoalbument-brightness-low-task
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        job-name: sihang-autoalbument-brightness-low-task
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - Tesla-V100-SXM2-32GB
      restartPolicy: Never
      containers:
        - name: pvc-test-container
          image: gitlab-registry.nrp-nautilus.io/nrp/scientific-images/python:cuda-v1.5.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-c"
          args:
            - |
              source activate base

              apt update && apt install git -y

              cd /mnt/synrs3d/SynRS3D
              nvidia-smi

              git checkout gaussian-baselines
              git pull

              echo "Pulling nested autoalbument repo..."
              cd autoalbument
              git clone https://github.com/lisihang1401443109/autoalbument.git
              git pull
              cd ..

              cd autoalbument
              bash install_autoalbument.sh
              export HYDRA_FULL_ERROR=1
              conda activate autoalbument
              cd brightness_low_task
              export PYTHONPATH=$PYTHONPATH:/mnt/synrs3d/SynRS3D/autoalbument/autoalbument

              bash run_autoalbument.sh
          resources:
            limits:
              cpu: "16"
              memory: 32Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "16"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: pvc-storage
              mountPath: /mnt/synrs3d
            - name: chuqiao-result
              mountPath: /mnt/styled
            - name: shm
              mountPath: /dev/shm
          securityContext:
            runAsUser: 0
      volumes:
        - name: pvc-storage
          persistentVolumeClaim:
            claimName: synrs3d-test
        - name: chuqiao-result
          persistentVolumeClaim:
            claimName: chuqiao-result-pvc
        - name: shm
          emptyDir:
            medium: Memory
  ttlSecondsAfterFinished: 86400
